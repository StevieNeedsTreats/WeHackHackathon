services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nodes-dont-lie-falkordb
    ports:
      - "6380:6379"
    environment:
      # Room in the plan cache for every constant query the agents use.
      FALKORDB_ARGS: "CACHE_SIZE 100"
    volumes:
      - truthgraph-data:/var/lib/falkordb/data
    restart: unless-stopped
  redis:
    # Caches, abstracts, verdicts and run logs; the graph holds only what is traversed.
    image: redis:7-alpine
    container_name: nodes-dont-lie-redis
    ports:
      - "6381:6379"
    volumes:
      - truthgraph-cache:/data
    restart: unless-stopped
# The volumes keep their original names so existing local data stays attached.
volumes:
  truthgraph-data:
  truthgraph-cache:
